# models params
AUTOENCODER:
  hidden_dim: 
    type: int
    low: 256
    high: 384
    step: 8

DEEP_AUTOENCODER:
  hidden_dims: 
    type: list_int
    low: 64
    high: 512
    step: 32
    min_elements: 1
    max_elements: 3
  dropout_rate:
    type: float
    low: 0.2
    high: 0.6
    logscale: False

MATRIX_FACTORIZATION:
  user_item_embedding_dim: 
    type: int
    low: 8
    high: 512
    step: 8
    

DEEP_MATRIX_FACTORIZATION:
  user_embedding_dim: 
    type: int
    low: 8
    high: 512
    step: 8
  item_embedding_dim:
    type: int
    low: 8
    high: 512
    step: 8
  hidden_dims: 
    type: list_int
    low: 8 
    high: 256
    step: 8
    min_elements: 1
    max_elements: 5
  dropout_rate:
    type: float
    low: 0.2
    high: 0.6
    logscale: False

NEUMF:
  embedding_dim:
    type: int
    low: 32
    high: 512
    step: 32
  n_hidden_layers:
    type: int
    low: 1
    high: 5
    step: 1
  dropout_rate:
    type: float
    low: 0.2
    high: 0.6
    logscale: False

# hyperparams
HYPERPARAMS:
  lr:
    type: float
    low: 0.0001
    high: 0.01
    logscale: True
  weight_decay:
    type: float
    low: 0.0006
    high: 0.006
    logscale: True
  optimizer_name: 
    type: categorical
    values: [adam, nadam, adamw, rmsprop]


# dataset params
DATASET:
  batch_size:
    type: int
    low: 32
    high: 512
    step: 32